[package]
name = "r2-control"
version = "0.1.0"
edition = "2021"
description = "Local Rust control application for the Attack Shark R2"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tao = "=0.37.0"
wry = "=0.57.0"
tray-icon = "=0.26.1"

[target.'cfg(windows)'.dependencies]
windows = "0.62"
webview2-com = "=0.39.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
